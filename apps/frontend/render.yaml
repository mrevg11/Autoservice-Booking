services:
  - type: web
    name: autoservice-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: apps/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
